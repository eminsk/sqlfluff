name: SQLFluff Cross-Platform CI (Linux, macOS, Windows)

on:
  push:
    branches: [ "ci-cross-platform-test" ]
  workflow_dispatch:

jobs:
  test-cv11:
    name: ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pyyaml ruff

      - name: Check formatting and lint
        run: |
          ruff check src/sqlfluff/rules/convention/CV11.py
          ruff format --check src/sqlfluff/rules/convention/CV11.py

      - name: Run CV11 tests
        run: |
          pytest test/rules/yaml_test_cases_test.py -k CV11 -v

      - name: Run standard rule tests
        run: |
          pytest test/rules/std_test.py -v
